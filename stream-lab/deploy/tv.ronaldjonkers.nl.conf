log_format tv_stream '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    listen [::]:80;
    server_name tv.ronaldjonkers.nl;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://tv.ronaldjonkers.nl$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tv.ronaldjonkers.nl;
    ssl_certificate /etc/letsencrypt/live/tv.ronaldjonkers.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tv.ronaldjonkers.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TVSSL:10m;
    ssl_session_timeout 1d;
    access_log /var/log/nginx/tv-stream-lab.access.log tv_stream;
    error_log /var/log/nginx/tv-stream-lab.error.log warn;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_socket_keepalive on;
    }
}
